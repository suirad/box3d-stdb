<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box3d sandbox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a2e; }
      canvas { display: block; }
      #toolbar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        z-index: 10;
        background: #1a1a2e;
        border: 1px solid #446;
        border-radius: 8px;
        padding: 8px 12px 10px;
      }
      #toolbar::before {
        content: "Controls";
        font-size: 11px;
        color: #8899aa;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-family: system-ui, sans-serif;
      }
      .toolbar-btns { display: flex; gap: 8px; }
      #toolbar button {
        padding: 6px 14px;
        background: #2a2a4e;
        color: #ccd;
        border: 1px solid #446;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.1s, border-color 0.1s, transform 0.1s;
      }
      #toolbar button:hover {
        background: #3a3a6e;
        border-color: #668;
        transform: translateY(-1px);
      }
      #toolbar button.active {
        background: #2a4a8e;
        border-color: #6699cc;
        color: #fff;
      }
      #links {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      #links a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 10px 6px;
        background: #2a2a4e;
        color: #ccd;
        border: 1px solid #446;
        border-radius: 8px;
        text-decoration: none;
        font-family: system-ui, sans-serif;
        font-size: 10px;
        letter-spacing: 0.04em;
        transition: background 0.1s, border-color 0.1s, transform 0.1s;
      }
      #links a:hover {
        background: #3a3a6e;
        border-color: #668;
        transform: translateY(-1px);
        color: #fff;
      }
      #links svg { width: 20px; height: 20px; }
      #hud {
        position: fixed;
        bottom: 12px;
        left: 12px;
        color: #aabbcc;
        font-family: monospace;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 10px;
        border-radius: 4px;
        z-index: 10;
        pointer-events: auto; /* capture clicks so the status text is selectable, not spawn-through */
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="toolbar-btns"></div>
    </div>
    <nav id="links">
      <a href="https://github.com/suirad/box3d-stdb" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Repository
      </a>
      <a href="https://suirad.github.io/box3d-stdb/docs/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Documentation
      </a>
    </nav>
    <div id="hud">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
