<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box3d sandbox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a2e; }
      canvas { display: block; }
      #toolbar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        z-index: 10;
        background: #1a1a2e;
        border: 1px solid #446;
        border-radius: 8px;
        padding: 8px 12px 10px;
      }
      #toolbar::before {
        content: "Controls";
        font-size: 11px;
        color: #8899aa;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-family: system-ui, sans-serif;
      }
      .toolbar-btns { display: flex; gap: 8px; }
      #toolbar button {
        padding: 6px 14px;
        background: #2a2a4e;
        color: #ccd;
        border: 1px solid #446;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.1s, border-color 0.1s, transform 0.1s;
      }
      #toolbar button:hover {
        background: #3a3a6e;
        border-color: #668;
        transform: translateY(-1px);
      }
      #toolbar button.active {
        background: #2a4a8e;
        border-color: #6699cc;
        color: #fff;
      }
      #hud {
        position: fixed;
        bottom: 12px;
        left: 12px;
        color: #aabbcc;
        font-family: monospace;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 10px;
        border-radius: 4px;
        z-index: 10;
        pointer-events: auto; /* capture clicks so the info link works and the text is selectable */
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="toolbar-btns"></div>
    </div>
    <div id="hud">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
