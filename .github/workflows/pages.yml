name: Deploy sandbox-client + API docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'examples/sandbox-client/**'
      - 'crates/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # box3d-sys's build script compiles the vendored C — cargo doc runs build scripts.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/sandbox-client/package-lock.json

      - name: Install dependencies
        working-directory: examples/sandbox-client
        run: npm ci

      - name: Build
        working-directory: examples/sandbox-client
        run: npm run build

      # docs.rs can't build this repo (git-only patch crate; the crates.io box3d-sys it would
      # pull cannot compile for wasm), so rustdoc is self-hosted under /docs on the same site.
      - name: Build API docs
        run: |
          rustup target add wasm32-unknown-unknown
          cargo doc --no-deps -p box3d-stdb --target wasm32-unknown-unknown

      - name: Merge docs into site
        run: |
          mkdir -p examples/sandbox-client/dist/docs
          cp -r target/wasm32-unknown-unknown/doc/* examples/sandbox-client/dist/docs/
          cat > examples/sandbox-client/dist/docs/index.html <<'EOF'
          <!doctype html><meta http-equiv="refresh" content="0; url=box3d_stdb/index.html">
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/sandbox-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
