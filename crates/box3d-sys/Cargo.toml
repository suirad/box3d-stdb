# This package replaces crates.io box3d-sys via [patch.crates-io]; name/version/links must track upstream.
[package]
name = "box3d-sys"
version = "0.1.14"
edition = "2021"
links = "box3d"
license = "MIT"
repository = "https://github.com/suirad/box3d-stdb"
description = "Raw Rust FFI bindings for Box3D, built for SpacetimeDB wasm modules"

[features]
# wasm SIMD128 via emscripten's SSE2 compat headers (shims/include/wasm-sse2).
# Default on: measured ~1.7x faster on contact-heavy scenes with bit-identical
# results vs scalar. Opt out with BOX3D_FORCE_SCALAR=1 (a feature can't do it —
# the box3d wrapper enables our defaults unconditionally).
default = ["simd"]
simd = []

[dependencies]
libm = "0.2"

[build-dependencies]
cc = "1"
